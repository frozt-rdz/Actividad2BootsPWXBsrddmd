</head>

<body class="bg-dark text-white d-flex flex-column min-vh-100">

        <div class="container">

                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../../index.html">Inicio</a></li>

                </ul>
            </div>

    <header class="text-center py-5 fondo-morado">
        <h1>Contáctanos</h1>
        <p class="fs-5 text-warning mb-0">Déjanos un mensaje y te responderemos pronto</p>
    </header>

    <main class="container my-5 flex-grow-1 d-flex align-items-center">

        <div class="row justify-content-center w-100">
            <div class="col-lg-10">

                <div class="card bg-black text-white borde-morado shadow-lg">
                    <div class="row g-0">
                        <div class="col-md-7 p-4 p-lg-5">
                            <h2 class="h4 text-warning mb-4">Formulario de Contacto</h2>

                            <form action="#" method="POST">

                                <div class="mb-3">
                                    <label for="nombre" class="form-label text-secondary small">Nombre completo</label>
                                    <input type="text" id="nombre" name="nombre"
                                        class="form-control bg-dark text-white border-secondary"
                                        placeholder="Ej. Salvador Ramírez" required>
                                </div>

                                <div class="mb-3">
                                    <label for="correo" class="form-label text-secondary small">Correo
                                        electrónico</label>
                                    <input type="email" id="correo" name="correo"
                                        class="form-control bg-dark text-white border-secondary"
                                        placeholder="ejemplo@correo.com" required>
                                </div>

                                <div class="mb-3">
                                    <label for="asunto" class="form-label text-secondary small">Asunto o Motivo</label>
                                    <select id="asunto" name="asunto"
                                        class="form-select bg-dark text-white border-secondary" required>
                                        <option value="" selected disabled>Selecciona una opción...</option>
                                        <option value="duda">Duda sobre el proyecto</option>
                                        <option value="colaboracion">Propuesta de colaboración</option>
                                        <option value="saludo">Solo para saludar</option>
                                        <option value="otro">Otro</option>
                                    </select>
                                </div>

                                <div class="mb-4">
                                    <label for="mensaje" class="form-label text-secondary small">Tu mensaje</label>
                                    <textarea id="mensaje" name="mensaje"
                                        class="form-control bg-dark text-white border-secondary" rows="4"
                                        placeholder="Escribe aquí tu mensaje..." required></textarea>
                                </div>

                                <button type="submit" class="btn btn-outline-warning w-100 fw-bold py-2">
                                    Enviar Mensaje <i class="bi bi-envelope-check ms-1"></i>
                                </button>

                            </form>
                        </div>

                        <div
                            class="col-md-5 d-none d-md-flex align-items-center justify-content-center bg-black rounded-end overflow-hidden p-3">
                            <img src="../../images/general/calavera.gif" alt="Contáctanos" class="img-fluid"
                                style="max-height: 400px;">
                        </div>

                    </div>
                </div>

            </div>
        </div>

    </main>

    <footer class="bg-black text-center py-4 border-top border-danger mt-auto">

        <p class="m-0 text-warning">Mastache De la paz David 24090917</p>
        <p class="m-0">Programación Web XB</p>
        <p class="m-0">Zacatepec, Morelos a 26 de octubre de 2026</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
